<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <title>Banterbird</title>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <img src=https://upload.wikimedia.org/wikipedia/en/b/b4/PrincessTwilightSparkle.png alt = "Img" width="200" height="200">
    <b>
        <u>
            <h1>Banterbird</h1>
        </u>
    </b>
    <div>
        Logged in as: <strong id="username">anonymus</strong>
    </div>
    <div>
        <h3>New Post</h3>
        <textarea id="postInput" placeholder="What's on your mind?"></textarea><br>
        <button onclick="submitPost()">Tweet</button>
    </div>
    <hr>
    <h3>Feed</h3>
    <div id="feed"></div>

    <template id="post-template">
        <div class="post">
            <p><strong class="username"></strong>: <span class="message"></span></p>
            <small class="timestamp"></small>
            <hr>
        </div>
    </template>
    <script>
        document.getElementById("username").innerText = localStorage.getItem("username");
    </script>
</body>
</html>
